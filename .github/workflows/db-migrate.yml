name: Supabase migrations

# Applies not-yet-applied migrations to the linked project via the Supabase CLI (`db push`).
#
# Two gates keep it from touching the auth token when there's nothing to do - so an expired token or
# password only ever fails the run when a migration genuinely needs applying:
#   1. `paths` below - the workflow only starts when something under migrations/ changes.
#   2. the `detect` step - a tokenless git check that skips the link/push steps unless this push ADDED a
#      migration file. Edits/renames/deletions of existing migrations, or doc-only churn, add no new
#      version to apply, so the token-authenticated steps are skipped and the run passes green.
#
# MANUAL RUN: Actions tab -> "Supabase migrations" -> "Run workflow" applies unconditionally, bypassing
# BOTH gates (it re-pushes all migrations; idempotent, so that's safe). Use it to apply out of band or to
# recover after a skipped/failed run. It only runs from main: a dispatch on any other branch is skipped.
#
# Requires three repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - a personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   - the project's database password (Project Settings -> Database)
#   SUPABASE_PROJECT_REF   - the project ref, e.g. ecrehwttqpgdpzroazwp (not sensitive; it's in the URL)
#
# The job runs in the `production` environment. Give it required reviewers and restrict its deployment
# branches to main (Settings -> Environments -> production), so a prod change needs a human approval.
# The secrets are handed only to the steps that use them, and the CLI version is pinned.
on:
  push:
    branches: [main]
    paths: ['backend/supabase/migrations/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need history to diff this push's base against its tip
          persist-credentials: false

      # Tokenless: decide whether any NEW migration file was added in this push. Renames are treated as an
      # add (--no-renames) since a new timestamp is a new version. A manual dispatch, or a push with no
      # usable base commit (new branch / first push), always runs.
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch -> run."; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          before="$BEFORE"
          after="$AFTER"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "No usable base commit -> run."; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          added=$(git diff --no-renames --name-only --diff-filter=A "$before" "$after" \
                    -- backend/supabase/migrations | grep -E '\.sql$' || true)
          if [ -n "$added" ]; then
            echo "New migration(s) in this push:"; echo "$added"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new migration files added -> skipping the token-authenticated push."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # A manual dispatch always applies (its own guarantee, independent of the detect gate); an automatic
      # push applies only when detect found a newly-added migration.
      # Pinned to the CLI version the migrations are tested with locally (pgTAP); bump deliberately.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.detect.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        with:
          version: 2.115.0

      - name: Link the project
        if: steps.detect.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF" --workdir backend

      - name: Push migrations
        if: steps.detect.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --workdir backend

      - name: Nothing to apply
        if: steps.detect.outputs.run != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No new migrations in this push; the token was never used."
