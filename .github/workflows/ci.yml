name: CI

# Builds and runs the test suites on every pull request, so a red test is caught before it merges rather than by
# remembering to run them locally.
#
#   windows - the whole solution (both app heads, the hook, the platform projects), the .NET suite, and
#             tools/test-install.ps1 (the installer tests; its download/verify checks skip without a local
#             releases\ folder, and nothing in it touches the network).
#   macos   - the cross-platform app head (the macOS port) and the .NET suite, which is meant to be portable.
#
# Pull requests only (opened, new commits, reopened); a plain branch push doesn't run it. workflow_dispatch runs it
# by hand on any branch. A PR touching only docs, captures, the docs site or the Supabase backend (tested separately
# with pgTAP) skips the build. Root-level *.md only: fixture .md files under tests/ must still build.
#
# That filter is the `changes` job, not a trigger-level paths-ignore: windows and macos are required checks on main,
# and a path-filtered workflow never reports them, which leaves the PR blocked. A job skipped by `if:` reports
# Skipped, which the ruleset accepts.
on:
  pull_request:
  workflow_dispatch:

# Read-only: nothing here writes to the repo. Every action is pinned to a commit SHA (the version is in the
# trailing comment); Dependabot proposes bumps.
permissions:
  contents: read

# A newer push to the same PR supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Filter changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if echo "$files" | grep -qvE '^([^/]+\.md|docs/|captures/|backend/|site/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: changes
    # Only an explicit "false" skips, so a failed filter job builds rather than waving the PR through.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK comes from global.json, so CI builds with the same SDK as a local build.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # On Windows the app head multi-targets, so this compiles both heads as well as the tests.
      - name: Build
        run: dotnet build perch.slnx -c Release

      # --blame-hang-timeout turns a hung test into a failure with a dump, instead of a run that sits until the
      # job timeout.
      - name: Test (.NET)
        run: dotnet test tests/Perch.Tests/Perch.Tests.csproj -c Release --no-build --blame-hang-timeout 10m --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Windows PowerShell 5.1, as documented in CLAUDE.md: the installer has to work there.
      - name: Test (installer)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\test-install.ps1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows
          path: TestResults/
          if-no-files-found: ignore

  macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Not the whole solution: Perch.Platform.Windows targets net10.0-windows, which doesn't build here. On this
      # host the app head builds only as the cross-platform net10.0 head (the macOS port).
      - name: Build (app head)
        run: dotnet build src/Perch.App/Perch.App.csproj -c Release

      - name: Test (.NET)
        run: dotnet test tests/Perch.Tests/Perch.Tests.csproj -c Release --blame-hang-timeout 10m --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-macos
          path: TestResults/
          if-no-files-found: ignore
