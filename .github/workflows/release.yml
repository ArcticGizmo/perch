name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Two build jobs (Windows + macOS) each produce artifacts but do NOT touch the GitHub Release. The final
# `release` job `needs` both, so it runs only when both builds succeed - a failure on either platform means
# no release is published (rather than a half-populated one). Re-running the failed job re-gates it.
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install vpk CLI
        run: dotnet tool install -g vpk

      - name: Get version from tag
        id: version
        run: echo "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: |
          dotnet publish src/Perch.App/Perch.App.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o publish/

      # perch-hook is the self-managed Claude Code hook binary. Publish it into the SAME dir as perch.exe
      # so Velopack packs the two together (windows-latest ships the required C++ build tools for AOT).
      - name: Publish perch-hook (NativeAOT)
        run: dotnet publish src/Perch.Hook/Perch.Hook.csproj -c Release -r win-x64 -o publish/

      - name: Pack with Velopack
        run: vpk pack --packId Perch --packTitle "Perch" --packVersion ${{ steps.version.outputs.VERSION }} --packDir publish/ --mainExe perch.exe --outputDir releases/

      # Everything in releases/: Perch-win-Setup.exe (what install.ps1 downloads and verifies), the Velopack
      # update feed the in-app updater reads (nupkg + RELEASES + releases.win.json), and the portable .zip.
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: releases/
          if-no-files-found: error

  build-macos:
    # arm64 runner - required: perch-hook is NativeAOT (osx-arm64) and can't cross-compile from x64.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install vpk CLI
        run: |
          dotnet tool install -g vpk
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Reuses the same script as a local mac build (publish perch + perch-hook for osx-arm64, pack the
      # unsigned .app, wrap it in a DMG). The version comes from the tag.
      - name: Publish + pack (unsigned arm64 .app + DMG)
        run: bash publish-mac.sh "${GITHUB_REF_NAME#v}"

      # The DMG + pkg installers plus the Velopack update feed (nupkg + RELEASES-osx + releases.osx.json)
      # the in-app updater reads. Deliberately omits the runnable Perch.app bundle (a directory) and the
      # portable .zip - neither is a shipped artifact.
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            releases/*.dmg
            releases/*.pkg
            releases/*.nupkg
            releases/RELEASES-osx
            releases/*.json
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Flatten both build jobs into the single flat namespace a GitHub Release actually has, then hash it.
      # SHA256SUMS.txt is what install.ps1 verifies the installer against before running it, so it has to
      # describe exactly the bytes that get uploaded - which is why it's generated here, from the artifacts
      # about to be published, rather than in either build job.
      - name: Collect artifacts and generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          mkdir -p dist
          # A duplicate basename across the two jobs would make the manifest ambiguous and silently publish
          # one of two different files under one name. Refuse rather than guess. (Velopack already keeps
          # these distinct - the macOS nupkg carries its channel, e.g. Perch-1.2.3-osx-full.nupkg.)
          while IFS= read -r f; do
            dest="dist/$(basename "$f")"
            if [ -e "$dest" ]; then
              echo "::error::Two build artifacts are both named $(basename "$f") - refusing to publish an ambiguous release."
              exit 1
            fi
            mv "$f" "$dest"
          done < <(find artifacts -type f | LC_ALL=C sort)

          # install.ps1 resolves this asset by name from the release metadata; a release without it can't be
          # installed by the one-liner, so fail here rather than shipping a broken install path.
          if [ ! -f dist/Perch-win-Setup.exe ]; then
            echo "::error::Perch-win-Setup.exe is missing - install.ps1 depends on it."
            exit 1
          fi

          # Generated outside dist/ and moved in, so the manifest can never race its own glob.
          ( cd dist && LC_ALL=C sha256sum -- * > ../SHA256SUMS.txt )
          mv SHA256SUMS.txt dist/SHA256SUMS.txt

          echo '### Published assets' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
