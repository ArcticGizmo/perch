name: Supabase functions

# Deploys the Supabase Edge Functions (currently just delete-account, the GDPR account-erasure endpoint)
# to the linked project via the Supabase CLI. Unlike migrations, a function EDIT must redeploy, so there is
# no "added file" gate - the paths filter below already scopes the run to genuine function changes, and each
# such change warrants a redeploy.
#
# MANUAL RUN: Actions tab -> "Supabase functions" -> "Run workflow" deploys on demand. It only runs from
# main: a dispatch on any other branch is skipped.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - a personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   - the project ref, e.g. ecrehwttqpgdpzroazwp (not sensitive; it's in the URL)
# No DB password is needed: functions deploy targets the project by ref, it doesn't touch the database.
# The function's own SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY are injected by Supabase
# at runtime - nothing to configure here.
#
# Like the migrations, the job runs in the `production` environment (required reviewers, main only), the
# token reaches only the deploy step, and the CLI version is pinned.
on:
  push:
    branches: [main]
    paths: ['backend/supabase/functions/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.115.0

      - name: Deploy delete-account
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy delete-account --project-ref "$PROJECT_REF" --workdir backend
