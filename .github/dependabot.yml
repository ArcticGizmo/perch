# Keeps the SHA-pinned actions in .github/workflows current: Dependabot understands the
# `uses: owner/repo@<sha> # vX.Y.Z` form and bumps the SHA and the comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
