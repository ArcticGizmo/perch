# Keeps the SHA-pinned actions in .github/workflows current: Dependabot understands the
# `uses: owner/repo@<sha> # vX.Y.Z` form and bumps the SHA and the comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The docs site's exact-pinned npm dependencies (site/package.json + package-lock.json). The cooldown keeps a
  # release at least two weeks old before it's proposed.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      site:
        patterns: ['*']
